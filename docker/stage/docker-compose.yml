services:
  tanstack-app:
    container_name: ${CONTAINER_NAME:-tanstack-app}
    build:
      # Build from the repository root so the Dockerfile can access the app code.
      context: ../..
      dockerfile: docker/stage/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${APP_HOST:-0.0.0.0}
      PORT: ${APP_PORT:-3000}
    ports:
      # Bind only to loopback so external traffic must traverse the host Nginx proxy.
      - '${BIND_HOST:-127.0.0.1}:${HOST_PORT:-3000}:${APP_PORT:-3000}'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 256
    init: true
