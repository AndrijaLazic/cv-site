name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build and deploy'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Make deployment script executable
        run: chmod +x deploy.sh

      - name: Run deployment script
        run: ./deploy.sh
